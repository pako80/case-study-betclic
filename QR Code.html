<!doctype html><html lang="en"><head><meta charset="utf-8"><title>QR Code</title><style>html,body{margin:0;height:100%;background:#fff;display:grid;place-items:center;font-family:-apple-system,system-ui,sans-serif}a{color:#111}a:hover{color:#6b6b6b}#qr{width:480px;height:480px;padding:24px;background:#fff}#qr svg{width:100%;height:100%;display:block}</style></head><body><div id="qr"></div><script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script><script>var q=qrcode(0,'M');q.addData('https://case-study-betclic.vercel.app/');q.make();document.getElementById('qr').innerHTML=q.createSvgTag({cellSize:10,margin:0,scalable:true});</script></body></html>
